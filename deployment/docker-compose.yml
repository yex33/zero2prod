services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  zero2prod:
    container_name: zero2prod
    build:
      context: ..
    ports:
      - "8000:8000"
    environment:
      - APP_DATABASE__HOST=db
      - APP_DATABASE__PORT=5432
      - APP_DATABASE__REQUIRE_SSL=false
      - APP_APPLICATION__BASE_URL=127.0.0.1
    depends_on:
      db:
        condition: service_healthy
